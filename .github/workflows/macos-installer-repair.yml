name: Repair Apple Silicon installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/macos-installer-repair.yml']
permissions:
  contents: read
concurrency:
  group: xgit-macos-installer-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download and inspect the published installer
        shell: bash
        run: |

          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          mkdir -p "$RUNNER_TEMP/xgit-repair" "$RUNNER_TEMP/output" "$RUNNER_TEMP/input-volume"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/input.dmg"   https://github.com/Ethan0007/XGit.IO/releases/download/v0.1.0-beta/XGit-macOS-arm64.dmg
          echo "1d5079bc85a2170988e41c9df87cb80fa8d6875d5b9315b726f9264c35522703  $RUNNER_TEMP/input.dmg" | shasum -a 256 -c -
          hdiutil verify "$RUNNER_TEMP/input.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/input-volume" "$RUNNER_TEMP/input.dmg"
          ditto "$RUNNER_TEMP/input-volume/XGit.IO.app" "$RUNNER_TEMP/xgit-repair/XGit.IO.app"
          hdiutil detach "$RUNNER_TEMP/input-volume"
          codesign --verify --deep --strict --verbose=4 "$RUNNER_TEMP/xgit-repair/XGit.IO.app" > "$RUNNER_TEMP/output/original-signature.txt" 2>&1 || true
          cat "$RUNNER_TEMP/output/original-signature.txt"
      - name: Repair native signatures and seal the app bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/layout-macos-bundle.py" <<'XGIT_SCRIPT'
          """Place managed resources and native libraries in macOS bundle directories.

          Relative links retain .NET's publish-directory lookup layout. No new application
          code or credentials are added to the bundle.
          """
          import os
          import sys
          from pathlib import Path

          def layout(app):
              app = app.resolve()
              macos = app / 'Contents/MacOS'
              if app.suffix != '.app' or not macos.is_dir():
                  raise ValueError('Pass a staged .app containing Contents/MacOS.')
              resources = app / 'Contents/Resources'
              frameworks = app / 'Contents/Frameworks'
              magic = {b'\xcf\xfa\xed\xfe', b'\xce\xfa\xed\xfe', b'\xfe\xed\xfa\xcf',
                       b'\xfe\xed\xfa\xce', b'\xca\xfe\xba\xbe', b'\xbe\xba\xfe\xca'}
              files = [p for p in macos.rglob('*') if p.is_file() and not p.is_symlink()]
              moved = 0
              native = 0
              for source in files:
                  relative = source.relative_to(macos)
                  with source.open('rb') as stream:
                      is_native = stream.read(4) in magic
                  if is_native and source.suffix != '.dylib':
                      destination = source
                  else:
                      destination = (frameworks if is_native else resources) / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      if destination.exists() or destination.is_symlink():
                          raise ValueError(f'Bundle destination already exists: {relative}')
                      source.rename(destination)
                      source.symlink_to(os.path.relpath(destination, source.parent))
                      moved += 1
                  if is_native:
                      # Maintain native lookup if the runtime resolves a managed-file link.
                      mirror = resources / relative
                      mirror.parent.mkdir(parents=True, exist_ok=True)
                      if not mirror.exists() and not mirror.is_symlink():
                          mirror.symlink_to(os.path.relpath(destination, mirror.parent))
                      native += 1
              print(f'Laid out {moved} resources/libraries and {native} native lookup links.')

          if __name__ == '__main__':
              layout(Path(sys.argv[1]))
          XGIT_SCRIPT
          cat > "$RUNNER_TEMP/sign-macos-app.sh" <<'XGIT_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          [[ "$(uname -s)" == Darwin ]] || { echo 'Sign app bundles on macOS.' >&2; exit 1; }
          app="${1:?Pass the staged XGit.IO.app directory}"
          identity="${2:--}"
          entitlements="${3:-$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)/macos-entitlements.plist}"
          [[ -d "$app/Contents/MacOS" && "$app" == *.app && -f "$entitlements" ]] || {
            echo 'Expected an app bundle and entitlements file.' >&2; exit 1;
          }

          # Remove build-stage metadata before sealing the bundle, never on an installed app.
          xattr -cr "$app"
          options=(--force --sign "$identity")
          if [[ "$identity" == - ]]; then
            options+=(--timestamp=none)
          else
            options+=(--timestamp --options runtime)
          fi
          count=0
          while IFS= read -r -d '' item; do
            if file -b "$item" | grep -q 'Mach-O'; then
              case "$item" in
                "$app/Contents/MacOS/XGit.IO")
                  # The main executable must be signed through its bundle so resources are sealed.
                  continue ;;
                "$app/Contents/MacOS/Agent/XGit.Agent"|"$app/Contents/MacOS/Relay/XGit.Relay")
                  codesign "${options[@]}" --entitlements "$entitlements" "$item" ;;
                *) codesign "${options[@]}" "$item" ;;
              esac
              codesign --verify --strict "$item"
              count=$((count + 1))
            fi
          done < <(find "$app/Contents" -type f -print0)
          [[ "$count" -ge 3 ]] || { echo 'Missing native app binaries.' >&2; exit 1; }
          codesign "${options[@]}" --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "Signed and verified $count Mach-O files and the complete app bundle."
          XGIT_SCRIPT
          cat > "$RUNNER_TEMP/macos-entitlements.plist" <<'XGIT_SCRIPT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
          </dict>
          </plist>
          XGIT_SCRIPT

          python3 "$RUNNER_TEMP/layout-macos-bundle.py" "$RUNNER_TEMP/xgit-repair/XGit.IO.app"

          bash "$RUNNER_TEMP/sign-macos-app.sh" "$RUNNER_TEMP/xgit-repair/XGit.IO.app" - "$RUNNER_TEMP/macos-entitlements.plist"
      - name: Create a native compressed HFS+ DMG
        shell: bash
        run: |

          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dmg-stage"
          ditto "$RUNNER_TEMP/xgit-repair/XGit.IO.app" "$RUNNER_TEMP/dmg-stage/XGit.IO.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-stage/Applications"
          hdiutil create -volname XGit.IO -fs HFS+ -srcfolder "$RUNNER_TEMP/dmg-stage" -format UDZO "$RUNNER_TEMP/output/XGit-macOS-arm64.dmg"
          hdiutil verify "$RUNNER_TEMP/output/XGit-macOS-arm64.dmg"
      - name: Validate and launch-test from the final DMG
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-macos-app.sh" <<'XGIT_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$(uname -s)" == Darwin ]] || { echo 'Verify app bundles on macOS.' >&2; exit 1; }
          app="${1:?Pass XGit.IO.app}"
          rid="${2:-osx-arm64}"
          case "$rid" in
            osx-arm64) architecture=arm64 ;;
            osx-x64) architecture=x86_64 ;;
            *) echo 'Unsupported Mac architecture.' >&2; exit 1 ;;
          esac
          plutil -lint "$app/Contents/Info.plist"
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" == io.xgit.desktop ]]
          for relative in XGit.IO Agent/XGit.Agent Relay/XGit.Relay; do
            executable="$app/Contents/MacOS/$relative"
            [[ -x "$executable" ]] || { echo "Missing executable: $relative" >&2; exit 1; }
            file -b "$executable" | grep -q "$architecture"
          done
          while IFS= read -r -d '' item; do
            if file -b "$item" | grep -q 'Mach-O'; then
              codesign --verify --strict "$item"
            fi
          done < <(find "$app/Contents" -type f -print0)
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "PASS: $rid app structure, executable permissions, and native code signatures."
          XGIT_SCRIPT
          cat > "$RUNNER_TEMP/smoke-macos-app.sh" <<'XGIT_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$(uname -s)" == Darwin ]] || { echo 'Launch-test on macOS.' >&2; exit 1; }
          app="${1:?Pass XGit.IO.app}"
          package="$app/Contents/MacOS"
          work="$(mktemp -d /tmp/xgit-macos-smoke.XXXXXX)"
          port=$((30000 + RANDOM % 15000))
          desktop_pid=''
          agent_pid=''
          cleanup() {
            for pid in "$desktop_pid" "$agent_pid"; do
              [[ -n "$pid" ]] && kill "$pid" 2>/dev/null || true
              [[ -n "$pid" ]] && wait "$pid" 2>/dev/null || true
            done
            echo "Smoke-test logs: $work"
          }
          trap cleanup EXIT

          # A fresh user sees consent first; the desktop must stay alive without a saved profile.
          XDG_DATA_HOME="$work/user-data" BINHUB_DATA_DIR="$work/data" \
            BINHUB_LISTEN_URL="http://127.0.0.1:$port" XGIT_LAN_PORT="$((port + 1))" \
            "$package/XGit.IO" >"$work/desktop.log" 2>&1 &
          desktop_pid=$!
          for _ in {1..40}; do
            if ! kill -0 "$desktop_pid" 2>/dev/null; then
              cat "$work/desktop.log" >&2
              echo 'Desktop exited during first-run launch.' >&2
              exit 1
            fi
            sleep 0.25
          done
          kill "$desktop_pid"
          wait "$desktop_pid" 2>/dev/null || true
          desktop_pid=''

          # Exercise the bundled agent separately without bypassing first-run user consent.
          BINHUB_DATA_DIR="$work/data" BINHUB_LISTEN_URL="http://127.0.0.1:$port" \
            XGIT_LAN_PORT="$((port + 1))" "$package/Agent/XGit.Agent" >"$work/agent.log" 2>&1 &
          agent_pid=$!
          ready=0
          for _ in {1..120}; do
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              cat "$work/agent.log" >&2
              echo 'Bundled agent exited.' >&2
              exit 1
            fi
            if [[ -s "$work/data/local.key" ]]; then
              key="$(cat "$work/data/local.key")"
              if curl --fail --silent --max-time 2 -H "X-BinHub-Local-Key: $key" \
                "http://127.0.0.1:$port/api/status" >"$work/status.json"; then
                ready=1
                break
              fi
            fi
            sleep 0.25
          done
          [[ "$ready" == 1 ]] || { cat "$work/agent.log" >&2; echo 'Agent readiness failed.' >&2; exit 1; }
          for endpoint in api/status api/network; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/$endpoint")"
            [[ "$status" == 401 ]] || { echo "Unauthenticated $endpoint returned $status." >&2; exit 1; }
          done
          echo "PASS: first-run desktop and authenticated bundled agent on $(uname -s) $(uname -m)."
          XGIT_SCRIPT

          [[ "$(uname -m)" == arm64 ]]
          mount="$RUNNER_TEMP/final-volume"
          mkdir -p "$mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$RUNNER_TEMP/output/XGit-macOS-arm64.dmg"
          bash "$RUNNER_TEMP/verify-macos-app.sh" "$mount/XGit.IO.app" osx-arm64
          bash "$RUNNER_TEMP/smoke-macos-app.sh" "$mount/XGit.IO.app"
          {
            echo "macOS $(sw_vers -productVersion) $(uname -m)"
            echo 'PASS: native DMG mount and app code signatures'
            echo 'PASS: desktop first-run launch and bundled agent readiness/authentication'
            echo 'Signing: ad hoc; not notarized; no Developer ID certificate'
          } > "$RUNNER_TEMP/output/validation-$(sw_vers -productVersion).txt"
          if spctl --assess --type execute --verbose=4 "$mount/XGit.IO.app" > "$RUNNER_TEMP/output/gatekeeper-policy-$(sw_vers -productVersion).txt" 2>&1; then
            echo 'Gatekeeper accepted the app.'
          else
            echo 'Gatekeeper does not automatically trust this ad-hoc, unnotarized build.'
            cat "$RUNNER_TEMP/output/gatekeeper-policy-$(sw_vers -productVersion).txt"
          fi
          hdiutil detach "$mount"
          trap - EXIT
      - name: Write installer checksums
        shell: bash
        run: |

          set -euo pipefail
          cd "$RUNNER_TEMP/output"
          echo '42e30125cefd8a93d1c9aee0655a2b25a085d6bb267e6520acf37eb0756ad0a2  XGit-Setup-Windows-x64.exe' > SHA256SUMS.txt
          shasum -a 256 XGit-macOS-arm64.dmg >> SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XGit-macOS-arm64-repaired
          path: ${{ runner.temp }}/output/*
          retention-days: 3
          if-no-files-found: error
  verify-current-macos:
    needs: repair
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: XGit-macOS-arm64-repaired
          path: ${{ runner.temp }}/output
      - name: Validate launch on current macOS
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-macos-app.sh" <<'XGIT_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$(uname -s)" == Darwin ]] || { echo 'Verify app bundles on macOS.' >&2; exit 1; }
          app="${1:?Pass XGit.IO.app}"
          rid="${2:-osx-arm64}"
          case "$rid" in
            osx-arm64) architecture=arm64 ;;
            osx-x64) architecture=x86_64 ;;
            *) echo 'Unsupported Mac architecture.' >&2; exit 1 ;;
          esac
          plutil -lint "$app/Contents/Info.plist"
          [[ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" == io.xgit.desktop ]]
          for relative in XGit.IO Agent/XGit.Agent Relay/XGit.Relay; do
            executable="$app/Contents/MacOS/$relative"
            [[ -x "$executable" ]] || { echo "Missing executable: $relative" >&2; exit 1; }
            file -b "$executable" | grep -q "$architecture"
          done
          while IFS= read -r -d '' item; do
            if file -b "$item" | grep -q 'Mach-O'; then
              codesign --verify --strict "$item"
            fi
          done < <(find "$app/Contents" -type f -print0)
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "PASS: $rid app structure, executable permissions, and native code signatures."
          XGIT_SCRIPT
          cat > "$RUNNER_TEMP/smoke-macos-app.sh" <<'XGIT_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          [[ "$(uname -s)" == Darwin ]] || { echo 'Launch-test on macOS.' >&2; exit 1; }
          app="${1:?Pass XGit.IO.app}"
          package="$app/Contents/MacOS"
          work="$(mktemp -d /tmp/xgit-macos-smoke.XXXXXX)"
          port=$((30000 + RANDOM % 15000))
          desktop_pid=''
          agent_pid=''
          cleanup() {
            for pid in "$desktop_pid" "$agent_pid"; do
              [[ -n "$pid" ]] && kill "$pid" 2>/dev/null || true
              [[ -n "$pid" ]] && wait "$pid" 2>/dev/null || true
            done
            echo "Smoke-test logs: $work"
          }
          trap cleanup EXIT

          # A fresh user sees consent first; the desktop must stay alive without a saved profile.
          XDG_DATA_HOME="$work/user-data" BINHUB_DATA_DIR="$work/data" \
            BINHUB_LISTEN_URL="http://127.0.0.1:$port" XGIT_LAN_PORT="$((port + 1))" \
            "$package/XGit.IO" >"$work/desktop.log" 2>&1 &
          desktop_pid=$!
          for _ in {1..40}; do
            if ! kill -0 "$desktop_pid" 2>/dev/null; then
              cat "$work/desktop.log" >&2
              echo 'Desktop exited during first-run launch.' >&2
              exit 1
            fi
            sleep 0.25
          done
          kill "$desktop_pid"
          wait "$desktop_pid" 2>/dev/null || true
          desktop_pid=''

          # Exercise the bundled agent separately without bypassing first-run user consent.
          BINHUB_DATA_DIR="$work/data" BINHUB_LISTEN_URL="http://127.0.0.1:$port" \
            XGIT_LAN_PORT="$((port + 1))" "$package/Agent/XGit.Agent" >"$work/agent.log" 2>&1 &
          agent_pid=$!
          ready=0
          for _ in {1..120}; do
            if ! kill -0 "$agent_pid" 2>/dev/null; then
              cat "$work/agent.log" >&2
              echo 'Bundled agent exited.' >&2
              exit 1
            fi
            if [[ -s "$work/data/local.key" ]]; then
              key="$(cat "$work/data/local.key")"
              if curl --fail --silent --max-time 2 -H "X-BinHub-Local-Key: $key" \
                "http://127.0.0.1:$port/api/status" >"$work/status.json"; then
                ready=1
                break
              fi
            fi
            sleep 0.25
          done
          [[ "$ready" == 1 ]] || { cat "$work/agent.log" >&2; echo 'Agent readiness failed.' >&2; exit 1; }
          for endpoint in api/status api/network; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/$endpoint")"
            [[ "$status" == 401 ]] || { echo "Unauthenticated $endpoint returned $status." >&2; exit 1; }
          done
          echo "PASS: first-run desktop and authenticated bundled agent on $(uname -s) $(uname -m)."
          XGIT_SCRIPT

          [[ "$(uname -m)" == arm64 ]]
          mount="$RUNNER_TEMP/final-volume"
          mkdir -p "$mount"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$RUNNER_TEMP/output/XGit-macOS-arm64.dmg"
          bash "$RUNNER_TEMP/verify-macos-app.sh" "$mount/XGit.IO.app" osx-arm64
          bash "$RUNNER_TEMP/smoke-macos-app.sh" "$mount/XGit.IO.app"
          {
            echo "macOS $(sw_vers -productVersion) $(uname -m)"
            echo 'PASS: native DMG mount and app code signatures'
            echo 'PASS: desktop first-run launch and bundled agent readiness/authentication'
            echo 'Signing: ad hoc; not notarized; no Developer ID certificate'
          } > "$RUNNER_TEMP/output/validation-$(sw_vers -productVersion).txt"
          if spctl --assess --type execute --verbose=4 "$mount/XGit.IO.app" > "$RUNNER_TEMP/output/gatekeeper-policy-$(sw_vers -productVersion).txt" 2>&1; then
            echo 'Gatekeeper accepted the app.'
          else
            echo 'Gatekeeper does not automatically trust this ad-hoc, unnotarized build.'
            cat "$RUNNER_TEMP/output/gatekeeper-policy-$(sw_vers -productVersion).txt"
          fi
          hdiutil detach "$mount"
          trap - EXIT
      - name: Upload current macOS test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XGit-macOS-current-validation
          path: |
            ${{ runner.temp }}/output/validation-*.txt
            ${{ runner.temp }}/output/gatekeeper-policy-*.txt
          retention-days: 3
